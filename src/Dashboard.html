<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: system-ui, sans-serif; background: #faf7f2; color: #333; margin: 0; padding: 24px; }
    h1 { font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    .stat .n { font-size: 32px; font-weight: 700; }
    .stat .l { font-size: 13px; color: #777; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar button, .toolbar input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; }
    .toolbar button.active { background: #8a6f4d; color: #fff; border-color: #8a6f4d; }
    .tablewrap { overflow-x: auto; background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #eee; vertical-align: top; }
    th { background: #f3eee6; white-space: nowrap; }
    .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
    .Attending { background: #d9f2df; } .Declined { background: #f8d9d9; } .Pending { background: #fdf0c8; } .Partial { background: #dfe8f7; }
    .names div { padding: 1px 0; }
    .muted { color: #888; font-size: 12px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>RSVP Dashboard</h1>
  <div id="error" class="error"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <button class="active" data-f="All">All</button>
    <button data-f="Attending">Attending</button>
    <button data-f="Declined">Declined</button>
    <button data-f="Partial">Partly answered</button>
    <button data-f="Pending">Pending</button>
    <input id="search" placeholder="Search household or name…">
    <button onclick="load()">Refresh</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>Household</th><th>Status</th><th>Seats</th><th>Attending</th><th>Not attending</th><th>Awaiting</th><th>Remarks</th><th>Last update</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const KEY = <?!= JSON.stringify(key).replace(/</g, '\\u003c') ?>;
    let data = null, filter = 'All';
    const $ = id => document.getElementById(id);

    function load() {
      google.script.run
        .withSuccessHandler(d => { $('error').textContent = ''; data = d; draw(); })
        .withFailureHandler(e => { $('error').textContent = e.message; })
        .getDashboardData(KEY);
    }

    function draw() {
      const t = data.totals;
      const cards = [
        [t.households, 'Households'], [t.invitees, 'Invited people'],
        [t.attending, 'Attending'], [t.declined, 'Not attending'], [t.pending, 'Awaiting response'],
        [t.seatsReserved, 'Seats reserved'], [t.openSeats, 'Seats not yet named']
      ];
      $('stats').innerHTML = cards.map(c => `<div class="stat"><div class="n">${c[0]}</div><div class="l">${c[1]}</div></div>`).join('');

      const q = $('search').value.toLowerCase();
      const list = data.households.filter(h =>
        (filter === 'All' || h.status === filter) &&
        [h.label].concat(h.attending, h.notAttending, h.pending).join(' ').toLowerCase().includes(q));

      const names = arr => arr.length ? `<div class="names">${arr.map(n => `<div>${esc(n)}</div>`).join('')}</div>` : '';
      $('rows').innerHTML = list.map(h => `<tr>
        <td>${esc(h.label)}</td>
        <td><span class="pill ${h.status}">${h.status === 'Partial' ? 'Partly answered' : h.status}</span></td>
        <td>${h.seats}${h.openSeats ? `<div class="muted">${h.openSeats} not named</div>` : ''}</td>
        <td>${names(h.attending)}</td><td>${names(h.notAttending)}</td><td>${names(h.pending)}</td>
        <td>${esc(h.remarks)}</td>
        <td>${esc(h.respondedAt)}${h.updatedBy ? `<div class="muted">by ${esc(h.updatedBy)}</div>` : ''}</td></tr>`).join('');
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    document.querySelectorAll('.toolbar button[data-f]').forEach(b => b.onclick = () => {
      filter = b.dataset.f;
      document.querySelectorAll('.toolbar button[data-f]').forEach(x => x.classList.toggle('active', x === b));
      draw();
    });
    $('search').oninput = draw;
    load();
  </script>
</body>
</html>
