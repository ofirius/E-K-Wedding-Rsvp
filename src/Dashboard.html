<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: system-ui, sans-serif; background: #faf7f2; color: #333; margin: 0; padding: 24px; }
    h1 { font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .stat { background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    .stat .n { font-size: 32px; font-weight: 700; }
    .stat .l { font-size: 13px; color: #777; }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
    .toolbar button, .toolbar input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 14px; cursor: pointer; }
    .toolbar button.active { background: #8a6f4d; color: #fff; border-color: #8a6f4d; }
    .tablewrap { overflow-x: auto; background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08); }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid #eee; vertical-align: top; }
    th { background: #f3eee6; white-space: nowrap; }
    .pill { padding: 2px 10px; border-radius: 999px; font-size: 12px; }
    .Attending { background: #d9f2df; } .Declined { background: #f8d9d9; } .Pending { background: #fdf0c8; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>RSVP Dashboard</h1>
  <div id="error" class="error"></div>
  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <button class="active" data-f="All">All</button>
    <button data-f="Attending">Attending</button>
    <button data-f="Declined">Declined</button>
    <button data-f="Pending">Pending</button>
    <input id="search" placeholder="Search name…">
    <button onclick="load()">Refresh</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr><th>Invitee</th><th>Status</th><th>Reserved</th><th>Confirmed</th><th>Attending</th><th>Not attending</th><th>Remarks</th><th>Responded</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script>
    const KEY = <?!= JSON.stringify(key).replace(/</g, '\\u003c') ?>;
    let data = null, filter = 'All';
    const $ = id => document.getElementById(id);

    function load() {
      google.script.run
        .withSuccessHandler(d => { $('error').textContent = ''; data = d; draw(); })
        .withFailureHandler(e => { $('error').textContent = e.message; })
        .getDashboardData(KEY);
    }

    function draw() {
      const t = data.totals;
      const cards = [
        [t.invitations, 'Invitations'], [t.attending, 'Attending'], [t.declined, 'Declined'], [t.pending, 'Awaiting response'],
        [t.seatsConfirmed, 'Guests confirmed'], [t.seatsPending, 'Seats still pending'],
        [t.seatsReleased, 'Seats released'], [t.seatsReserved, 'Seats reserved total']
      ];
      $('stats').innerHTML = cards.map(c => `<div class="stat"><div class="n">${c[0]}</div><div class="l">${c[1]}</div></div>`).join('');

      const q = $('search').value.toLowerCase();
      const list = data.guests.filter(g =>
        (filter === 'All' || g.status === filter) &&
        (g.name + ' ' + g.attending + ' ' + g.notAttending).toLowerCase().includes(q));
      $('rows').innerHTML = list.map(g => `<tr>
        <td>${esc(g.name)}</td>
        <td><span class="pill ${g.status}">${g.status}</span></td>
        <td>${g.seatsReserved ?? ''}</td><td>${g.seatsConfirmed ?? ''}</td>
        <td>${esc(g.attending || '')}</td><td>${esc(g.notAttending || '')}</td>
        <td>${esc(g.remarks || '')}</td><td>${g.respondedAt}</td></tr>`).join('');
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    document.querySelectorAll('.toolbar button[data-f]').forEach(b => b.onclick = () => {
      filter = b.dataset.f;
      document.querySelectorAll('.toolbar button[data-f]').forEach(x => x.classList.toggle('active', x === b));
      draw();
    });
    $('search').oninput = draw;
    load();
  </script>
</body>
</html>
