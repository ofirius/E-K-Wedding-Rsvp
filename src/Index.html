<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Georgia, serif; background: #faf7f2; color: #333; margin: 0; padding: 24px; }
    .card { max-width: 480px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { margin: 0; font-weight: normal; }
    h2 { margin-top: 0; font-weight: normal; }
    .header { text-align: center; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #eee; }
    .monogram { display: block; margin: 0 auto 14px; max-width: 120px; max-height: 120px; }
    .header h1 { font-size: 28px; letter-spacing: .5px; }
    .when { margin: 10px 0 0; font-size: 16px; }
    .deadline { margin: 6px 0 0; font-size: 14px; font-style: italic; color: #8a6f4d; }
    label { display: block; margin: 16px 0 6px; font-size: 14px; }
    input, textarea, button { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
    button { background: #8a6f4d; color: #fff; border: 0; margin-top: 20px; cursor: pointer; }
    button:disabled { opacity: .6; }
    button.link { background: none; color: #8a6f4d; border: 0; margin-top: 12px; text-decoration: underline; font-size: 14px; }
    .choice { display: flex; gap: 10px; }
    .choice button { margin: 0; background: #fff; color: #333; border: 1px solid #ccc; }
    .choice button.active { background: #8a6f4d; color: #fff; border-color: #8a6f4d; }
    .seat { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
    .seat input { flex: 1; min-width: 0; }
    .tog { display: flex; gap: 4px; }
    .tog button { margin: 0; width: auto; padding: 8px 10px; font-size: 13px; background: #fff; color: #333; border: 1px solid #ccc; white-space: nowrap; }
    .tog button.on-yes { background: #3f7d4e; color: #fff; border-color: #3f7d4e; }
    .tog button.on-no { background: #a94442; color: #fff; border-color: #a94442; }
    .searchbox { position: relative; }
    .searchbox::before { content: '\1F50D'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: .6; pointer-events: none; }
    .searchbox input { padding-left: 38px; border: 2px solid #8a6f4d; border-radius: 999px; background: #fff; }
    .searchbox input:focus { outline: none; box-shadow: 0 0 0 3px rgba(138,111,77,.2); }
    .matches { margin-top: 22px; padding: 14px; background: #f3eee6; border-radius: 10px; }
    .matches-title { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #8a6f4d; margin-bottom: 8px; }
    .result { display: flex; justify-content: space-between; align-items: center; background: #fff; color: #333; border: 0; border-left: 4px solid #8a6f4d; border-radius: 6px; margin-top: 8px; text-align: left; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .result:hover { background: #fffaf2; }
    .result .go { color: #8a6f4d; font-size: 20px; line-height: 1; }
    .hidden { display: none; }
    .hint { color: #777; font-size: 14px; }
    .error { color: #b00020; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <img id="monogram" class="monogram hidden" alt="Emman &amp; Kath monogram">
      <h1>Emman &amp; Kath's Wedding</h1>
      <p class="when">Saturday, November 28, 2026 - 2:00 PM</p>
      <p class="deadline">RSVP by November 20, 2026</p>
    </div>

    <!-- Step 1: search by name -->
    <div id="searchView" class="hidden">
      <label for="q">Search your name to view your reservation</label>
      <div class="searchbox">
        <input id="q" type="search" placeholder="Type your name…" autocomplete="off">
      </div>
      <div id="searchMsg" class="hint" style="margin-top:10px"></div>
      <div id="matches" class="matches hidden">
        <div class="matches-title">Select your name</div>
        <div id="results"></div>
      </div>
    </div>

    <!-- Step 2: RSVP form -->
    <div id="formView" class="hidden">
      <h2 id="greeting"></h2>
      <p>Will you be joining us?</p>
      <div class="choice">
        <button id="yesBtn" onclick="setStatus('Attending')">Joyfully accept</button>
        <button id="noBtn" onclick="setStatus('Declined')">Regretfully decline</button>
      </div>

      <div id="seatsWrap" class="hidden">
        <label>Who's coming? <span id="seatsHint" class="hint"></span></label>
        <div id="party"></div>
      </div>

      <label for="remarks">Remarks (dietary needs, a message for the couple…)</label>
      <textarea id="remarks" rows="3"></textarea>

      <button id="submitBtn" onclick="submit()">Send RSVP</button>
      <div id="error" class="error"></div>
      <button class="link" onclick="backToSearch()">Not you? Search again</button>
    </div>

    <!-- Step 3: done -->
    <div id="doneView" class="hidden">
      <h2>Thank you!</h2>
      <p id="doneMsg"></p>
      <button onclick="show('formView')">Change my response</button>
    </div>
  </div>

  <script>
    let guestId = '', guest = null, status = null, members = [], timer = null, searchSeq = 0;
    const $ = id => document.getElementById(id);
    const show = id => ['searchView', 'formView', 'doneView'].forEach(v => $(v).classList.toggle('hidden', v !== id));

    /* ---- search ---- */
    $('q').addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(runSearch, 400); // debounce
    });

    function runSearch() {
      const q = $('q').value.trim();
      clearResults();
      if (q.length < 3) { $('searchMsg').textContent = q ? 'Keep typing…' : ''; return; }
      const seq = ++searchSeq;
      $('searchMsg').textContent = 'Searching…';
      google.script.run
        .withSuccessHandler(list => { if (seq === searchSeq) renderResults(list); }) // ignore stale responses
        .withFailureHandler(e => { if (seq === searchSeq) $('searchMsg').textContent = e.message; })
        .searchGuests(q);
    }

    function clearResults() {
      $('results').innerHTML = '';
      $('matches').classList.add('hidden');
    }

    function renderResults(list) {
      clearResults();
      if (!list.length) {
        $('searchMsg').textContent = 'No match. Try your full name as it appears on the invitation, or ask the couple.';
        return;
      }
      $('searchMsg').textContent = '';
      list.forEach(g => {
        const b = document.createElement('button');
        b.className = 'result';
        const label = document.createElement('span');
        label.textContent = g.name; // textContent, so names can't inject HTML
        const go = document.createElement('span');
        go.className = 'go';
        go.textContent = '\u203A';
        b.append(label, go);
        b.onclick = () => pick(g.id);
        $('results').appendChild(b);
      });
      $('matches').classList.remove('hidden');
    }

    function pick(id) {
      google.script.run
        .withSuccessHandler(g => {
          if (!g) { $('searchMsg').textContent = 'Something went wrong. Please search again.'; return; }
          guestId = id; guest = g; render();
        })
        .withFailureHandler(e => { $('searchMsg').textContent = e.message; })
        .getGuest(id);
    }

    function backToSearch() {
      guestId = ''; guest = null;
      $('q').value = ''; clearResults(); $('searchMsg').textContent = '';
      show('searchView');
    }

    /* ---- RSVP form ---- */
    function render() {
      $('greeting').textContent = 'Hi, ' + guest.name + '!';
      members = guest.members.map(m => ({ name: m.name, attending: m.attending !== false })); // default: attending
      $('seatsHint').textContent = '(' + guest.seatsReserved + ' seat' + (guest.seatsReserved > 1 ? 's' : '') + ' reserved for you)';
      drawParty();
      $('remarks').value = guest.remarks || '';
      $('error').textContent = '';
      setStatus(guest.status === 'Pending' ? null : guest.status);
      show('formView');
    }

    function drawParty() {
      const box = $('party');
      box.innerHTML = '';
      members.forEach(m => {
        const row = document.createElement('div');
        row.className = 'seat';

        const input = document.createElement('input');
        input.value = m.name;
        input.placeholder = 'Guest name (leave blank if unused)';
        input.maxLength = 80;
        input.oninput = () => { m.name = input.value; };

        const tog = document.createElement('div');
        tog.className = 'tog';
        const yes = document.createElement('button');
        const no = document.createElement('button');
        yes.textContent = 'Attending';
        no.textContent = 'Not attending';
        const paint = () => {
          yes.className = m.attending ? 'on-yes' : '';
          no.className = m.attending ? '' : 'on-no';
        };
        yes.onclick = () => { m.attending = true; paint(); };
        no.onclick = () => { m.attending = false; paint(); };
        paint();
        tog.append(yes, no);

        row.append(input, tog);
        box.appendChild(row);
      });
    }

    function setStatus(s) {
      status = s;
      $('yesBtn').classList.toggle('active', s === 'Attending');
      $('noBtn').classList.toggle('active', s === 'Declined');
      $('seatsWrap').classList.toggle('hidden', s !== 'Attending');
    }

    function submit() {
      $('error').textContent = '';
      if (!status) { $('error').textContent = 'Please choose attending or declining.'; return; }
      if (status === 'Attending') {
        const named = members.filter(m => m.name.trim());
        if (!named.length) { $('error').textContent = 'Please enter at least one name.'; return; }
        if (!named.some(m => m.attending)) { $('error').textContent = 'Mark at least one person as attending, or choose "Regretfully decline".'; return; }
      }
      $('submitBtn').disabled = true;
      google.script.run
        .withSuccessHandler(res => {
          $('submitBtn').disabled = false;
          $('doneMsg').textContent = res.status === 'Attending'
            ? "We can't wait to celebrate with you. We have you down for " + res.attending + (res.attending > 1 ? ' guests.' : ' guest.')
            : "We'll miss you, thank you for letting us know.";
          show('doneView');
        })
        .withFailureHandler(e => { $('submitBtn').disabled = false; $('error').textContent = e.message; })
        .submitRsvp(guestId, { status: status, members: members, remarks: $('remarks').value });
    }
